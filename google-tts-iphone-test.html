<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piper DSB — скачать и сказать</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#09090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:auto;padding:24px 16px 60px}
.card{background:#18181b;border:1px solid #3f3f46;border-radius:20px;padding:18px}
h1{font-size:25px;margin:0 0 12px}p{color:#aaa;line-height:1.45}
button{width:100%;min-height:64px;border:0;border-radius:15px;background:#7656bd;color:#fff;font-size:19px;font-weight:800;margin:10px 0}
button:disabled{opacity:.55}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#050506;border-radius:14px;padding:14px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:110px}
audio{width:100%;margin-top:12px}
</style>
</head>
<body><main>
<h1>DSB — один тест</h1>
<p>Одна кнопка. Если модели нет — она скачивается и сохраняется. Сразу после этого заранее заданная фраза должна синтезироваться и проиграться.</p>
<div class="card">
<button id="go">СКАЧАТЬ (ЕСЛИ НУЖНО) И СРАЗУ СКАЗАТЬ</button>
<pre id="log">Загрузка Piper JS…</pre>
<audio id="audio" controls playsinline></audio>
</div>

<script type="module">
const VOICE='sr_RS-serbski_institut-medium';
const TEXT='Zdravo! Ovo je test. Ako me čuješ, Piper radi.';
const go=document.getElementById('go');
const log=document.getElementById('log');
const audio=document.getElementById('audio');
let tts=null;

function show(x){ log.textContent=String(x); }
function errText(e){
  return [
    e?.name ? 'Тип: '+e.name : '',
    e?.message ? 'Сообщение: '+e.message : '',
    e?.stack ? '\nСтек:\n'+e.stack : ''
  ].filter(Boolean).join('\n');
}

try{
  /* Не esm.sh. Берём опубликованный ESM-пакет через jsDelivr. */
  tts=await import('https://cdn.jsdelivr.net/npm/@jtsage/piper-tts-web@1.2.0/+esm');
  show('Piper JS загружен ✓\nЭкспорты: '+Object.keys(tts).sort().join(', ')+'\n\nНажми кнопку.');
}catch(e){
  show('НЕ ЗАГРУЗИЛСЯ PIPER JS\n\n'+errText(e));
}

go.onclick=async()=>{
  if(!tts){ show('Piper JS не загружен. Смотри ошибку выше.'); return; }
  go.disabled=true;
  const started=performance.now();

  try{
    if(typeof tts.CachedFileReader!=='function') throw new Error('Нет CachedFileReader в опубликованном модуле.');
    if(typeof tts.TtsSession!=='function') throw new Error('Нет TtsSession в опубликованном модуле.');

    show('1/4 Открываю локальное хранилище модели…');

    /* Ровно схема из Advanced Configuration пакета:
       CachedFileReader -> TtsSession -> session.predict(text) */
    const reader=new tts.CachedFileReader({});

    show('2/4 Загружаю/открываю DSB…\nЕсли модель уже сохранена, повторно качаться не должна.');

    const session=new tts.TtsSession({
      voiceId:VOICE,
      fileReader:reader,
      allowLocalModels:true,
      fallbackStrategy:'auto',
      progress:(p)=>{
        if(p && Number.isFinite(p.loaded) && Number.isFinite(p.total) && p.total>0){
          show('2/4 Модель DSB: '+Math.round(p.loaded*100/p.total)+'%');
        }
      },
      logger:(m)=>{
        if(m) show('Piper: '+m);
      }
    });

    show('3/4 Модель готова. Создаю речь…');

    const wav=await Promise.race([
      session.predict(TEXT),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Синтез не завершился за 60 секунд. Piper завис внутри phonemizer/ONNX.')),60000))
    ]);

    if(!(wav instanceof Blob)) throw new Error('Piper вернул не Blob. Получено: '+Object.prototype.toString.call(wav));
    if(wav.size<44) throw new Error('Piper вернул пустой WAV: '+wav.size+' байт.');

    show('4/4 WAV создан ✓  '+Math.round(wav.size/1024)+' KB\nЗапускаю звук…');

    if(audio.dataset.url) URL.revokeObjectURL(audio.dataset.url);
    const url=URL.createObjectURL(wav);
    audio.dataset.url=url;
    audio.src=url;
    audio.load();

    try{
      await audio.play();
    }catch(playErr){
      throw new Error('WAV СОЗДАН ('+Math.round(wav.size/1024)+' KB), но браузер не разрешил audio.play(): '+playErr.message);
    }

    show('РАБОТАЕТ ✓\nDSB сказал тестовую фразу.\nВремя: '+((performance.now()-started)/1000).toFixed(1)+' сек.');
  }catch(e){
    show('НЕ РАБОТАЕТ.\n\n'+errText(e)+
      '\n\nURL: '+location.href+
      '\nHTTPS: '+window.isSecureContext+
      '\nUserAgent: '+navigator.userAgent);
  }finally{
    go.disabled=false;
  }
};
</script>
</main></body></html>
